name: Build and Package Iced App

on:
  push:
    branches: [ release ]
    tags: [ 'v*' ] # Se déclenche lors d'un tag (ex: v1.0.0) pour créer une release
  pull_request:
    branches: [ release ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Évite que l'échec d'un OS n'arrête les autres
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: debian-package
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: windows-setup
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact_name: macos-dmg
            target: x86_64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- CACHE : Pour accélérer les builds suivants ---
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      # --- DÉPENDANCES LINUX (INDISPENSABLE POUR ICED) ---
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libx11-dev libgtk-3-dev

      # --- INSTALLATION DE CARGO-PACKAGER ---
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # --- COMPILATION ET PACKAGING ---
      - name: Build and Package
        # Cette commande utilise votre fichier packager.toml
        run: cargo packager --release

      # --- ENVOI DES FICHIERS (ARTIFACTS) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # Ajustez le chemin selon votre configuration packager.toml
          path: dist/* # --- OPTIONNEL : CRÉER UNE RELEASE AUTOMATIQUE ---
  release:
    permissions: write-all
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "**/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
