name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # opener (used for Message::OpenUrl) pulls in the `dbus` crate on Linux,
      # which links against the system libdbus via pkg-config at build time.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      # russh's vendored-openssl feature builds OpenSSL from source; on
      # Windows that requires NASM for the assembly-optimized routines.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf rustty-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release rustty

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rustty.exe -DestinationPath rustty-${{ matrix.target }}.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustty-${{ matrix.target }}
          path: rustty-${{ matrix.target }}.*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rustty-${{ matrix.target }}.*
